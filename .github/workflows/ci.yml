name: Container CI and build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_deploy.py'
      - run: for script in deploy/cloud/*.sh; do bash -n "$script"; done
      - run: bash deploy/cloud/smoke-test.sh
  build:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
      ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate image repository
        id: repository
        run: python3 deploy/cloud/image_metadata.py repository
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.repository.outputs.registry }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Compatible with the existing ACR Personal Edition registry.
          provenance: false
          sbom: false
          outputs: type=image,push=true,oci-mediatypes=false
          tags: ${{ steps.repository.outputs.repository }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record image for promotion
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: python3 deploy/cloud/image_metadata.py create image-metadata/image.json
      - uses: actions/upload-artifact@v4
        with:
          name: shadowtable-image
          path: image-metadata/image.json
          retention-days: 90
          overwrite: true
