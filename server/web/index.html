<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#101c24" />
    <link rel="icon" href="/icon.svg" />
    <title>桌边助手 · ShadowTable</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/room-list.css" />
    <link rel="stylesheet" href="/room-menu.css" />
    <link rel="stylesheet" href="/room-confirmation.css" />
    <link rel="stylesheet" href="/leaderboard.css" />
    <link rel="stylesheet" href="/monthly.css" />
    <link rel="stylesheet" href="/board-detail.css" />
    <script src="/builtin-avatars.js" defer></script>
    <script src="/fun-copy.js" defer></script>
    <script src="/result-registration.js" defer></script>
    <script src="/honors.js" defer></script>
    <link rel="stylesheet" href="/honors.css" />
    <script src="/leaderboard-presentation.js" defer></script>
    <script src="/monthly-report.js" defer></script>
    <script src="/poster-canvas.js" defer></script>
    <script src="/monthly-report-card.js" defer></script>
    <script src="/public-history.js" defer></script>
    <script src="/room-swipe.js" defer></script>
    <script src="/room-list.js" defer></script>
    <script src="/room-confirmation.js" defer></script>
    <script src="/badges.js" defer></script>
    <script src="/board-detail.js" defer></script>
    <script src="/avoidance.js" defer></script>
    <script src="/badge-awards.js" defer></script>
    <script src="/app.js" defer></script>
    <link rel="stylesheet" href="/avoidance.css" />
    <link rel="stylesheet" href="/badges.css" />
    <link rel="stylesheet" href="/badge-awards.css" />
    <link rel="stylesheet" href="/match-story.css" />
  </head>
  <body>
    <main id="app"></main>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="modal" class="dialog-backdrop" hidden>
      <div class="error-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-room-context modal-message">
        <div class="dialog-title" id="modal-title"></div>
        <div id="modal-room-context" class="dialog-room-context" hidden><img src="/assets/home-table-blue.svg" alt="" /><span>房间</span><span id="modal-room-code" class="dialog-room-code"></span><span id="modal-room-status" class="dialog-room-status"></span></div>
        <div class="dialog-grant-context" id="modal-grant-context" hidden><span>本次获得</span><span class="dialog-grant-amount" id="modal-grant-amount"></span></div>
        <div class="dialog-message" id="modal-message"></div>
        <div class="dialog-actions">
          <button type="button" class="secondary" id="modal-cancel">取消</button>
          <button type="button" class="primary" id="modal-ok">确定</button>
        </div>
      </div>
    </div>
  </body>
</html>
