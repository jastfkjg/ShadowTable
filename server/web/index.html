<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#101c24" />
    <link rel="icon" href="/icon.svg" />
    <title>桌边助手 · ShadowTable</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main id="app"></main>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="modal" class="dialog-backdrop" hidden>
      <div class="error-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="dialog-title" id="modal-title"></div>
        <div class="dialog-message" id="modal-message"></div>
        <div class="dialog-actions">
          <button type="button" class="secondary" id="modal-cancel">取消</button>
          <button type="button" class="primary" id="modal-ok">确定</button>
        </div>
      </div>
    </div>
  </body>
</html>
